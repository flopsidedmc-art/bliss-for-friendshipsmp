# BlissLike-Gems config (original, inspired by Bliss SMP S3 mechanics)
# Energy: 0=BROKEN, 1=RUINED, 2=DAMAGED, 3=CRACKED, 4=SCRATCHED, 5-9=PRISTINE(+1..+4), 10=PRISTINE+5

energy:
  start: 5
  max: 10
  min: 0
  kill-gain: 1
  death-loss: 1
  # if killer is at max (10), victim drops a bottle instead of killer gaining
  drop-bottle-at-max: true

cooldowns-seconds:
  # Fallbacks only — real values are per-ability in GemListener#cooldownMs.
  # Abilities: crisp 15, pockets 10, thunderstep 15, doublejump 5, vortex 60,
  #   burst 10, drift 15 (flat), bounty 35.
  # Powers: cozy 180, chad 120, nullify 120, fireball 180, itemlock 120,
  #   richrush 300, amp 240, storm 120, dash 40, bash 60, daggers 90,
  #   projection 120, heartdrainer 120, circle 120, beam 120, overdrive 180, void 120.
  power: 20
  tier2-ability: 35
  # energy 3-4 makes cooldowns 1.5x longer (Cracked/Scratched)
  damaged-multiplier: 1.5

passives:
  tick-seconds: 2
  puff-no-fall: true
  strength-level: 1
  speed-level: 1

actionbar:
  update-ticks: 2
  show-cooldown: true
  # Bliss-style HUD: one entry per ability, each with its own icon and its own timer.
  # Ready! = green; cooldowns = cyan; active abilities = red Active...
  # Tier 2 gems show left-click power, right-click power, then the offhand ability. Tier 1 gems show the ability only.
  # Defaults are Bliss Pack v3.5 font glyphs: the pack's per-ability icons, and the gem's crystal for its ability.
  icons:
    ASTRA: { left: "\uA41F", right: "\uA420", ability: "\uA43D" } # daggers, projection, drift
    FIRE: { left: "\uA425", right: "\uA426", ability: "\uA43F" } # fireball, cozy campfire, crisp
    FLUX: { left: "\uA427", right: "\uA428", ability: "\uA441" } # energy beam, overdrive, kinetic burst
    LIFE: { left: "\uA42A", right: "\uA42B", ability: "\uA443" } # heart drainer, circle of life, vortex
    PUFF: { left: "\uA430", right: "\uA42F", ability: "\uA445" } # breezy bash, dash, double jump
    SPEED: { left: "\uA433", right: "\uA432", ability: "\uA447" } # blur (injection), speedy storm, thunderstep
    STRENGTH: { left: "\uA437", right: "\uA436", ability: "\uA449" } # nullify, chad strength, bounty hunter
    WEALTH: { left: "\uA43B", right: "\uA43C", ability: "\uA44B" } # item lock, rich rush, pockets

protection:
  keep-on-death: true
  prevent-drop: true
  prevent-chest-store: true
  single-gem-only: true

# ---------------- Mythic Gems ----------------
# Mythics intentionally ignore the normal 0-10 energy system and are not soul-kept.
# Sounds. Every gem sound is one entry: sounds.<gem>.<ability>: {event, volume, pitch, enabled} plus at most one
# "layer" played on the same tick. event is a Bukkit sound name (ENTITY_RAVAGER_ROAR) or a key
# (minecraft:entity.ravager.roar, or a pack sound like blissgems:auratus.parry). A pack sound replaces the vanilla one;
# give it a "fallback" (same fields) for when custom-enabled is false. Pitch is kept within 0.5-2.0. Volume above 1
# does not get louder up close, it carries further (about 16 blocks x volume). Unknown names are listed in the
# console at startup. Full table: SOUNDS.md.
sounds:
  custom-enabled: true # false: pack sounds (blissgems:...) are skipped and their fallback plays
  volume: 1.0 # scales every gem sound
  general: # Shared by every gem
    not-ready: {event: BLOCK_NOTE_BLOCK_BASS, volume: 1.0, pitch: 0.5, enabled: true}  # you only: not enough energy, or the Relay bar isn't full
    gem-disabled: {event: BLOCK_BEACON_DEACTIVATE, volume: 0.8, pitch: 0.8, enabled: true}  # only the player whose gem was disabled hears it
  strength: # Strength: heavy, brutal (ravager, mace)
    chad-strength: {event: ENTITY_RAVAGER_ROAR, volume: 0.9, pitch: 1.2, enabled: true, layer: {event: ITEM_MACE_SMASH_GROUND_HEAVY, volume: 1.0, pitch: 0.6}}
    chad-fourth-hit: {event: ITEM_MACE_SMASH_GROUND, volume: 1.0, pitch: 1.2, enabled: true}  # the x2 hit
    nullify: {event: BLOCK_CONDUIT_DEACTIVATE, volume: 1.0, pitch: 0.6, enabled: true, layer: {event: ENTITY_ILLUSIONER_CAST_SPELL, volume: 0.7, pitch: 0.8}}
    bounty-hunter: {event: ENTITY_RAVAGER_AMBIENT, volume: 0.8, pitch: 0.7, enabled: true}  # you only, when the target is set
  fire: # Fire: crackle, whoosh
    fireball-charge: {event: ENTITY_BLAZE_BURN, volume: 0.8, pitch: 1.0, enabled: true}  # repeats every 1.5s while charging
    fireball-launch: {event: ENTITY_GHAST_SHOOT, volume: 0.9, pitch: 0.8, enabled: true}
    fireball-hit: {event: ENTITY_GENERIC_EXPLODE, volume: 0.6, pitch: 1.2, enabled: false}  # off: the explosion already makes its own boom
    cozy-campfire: {event: BLOCK_CAMPFIRE_CRACKLE, volume: 1.0, pitch: 1.0, enabled: true, layer: {event: ITEM_FIRECHARGE_USE, volume: 0.8, pitch: 0.8}}
    crisp: {event: ITEM_FIRECHARGE_USE, volume: 0.9, pitch: 1.4, enabled: true, layer: {event: BLOCK_FIRE_EXTINGUISH, volume: 0.8, pitch: 1.0}}
  speed: # Speed: high, electric
    blur: {event: ITEM_TRIDENT_RIPTIDE_1, volume: 1.0, pitch: 1.6, enabled: true}
    speedy-storm: {event: ENTITY_LIGHTNING_BOLT_IMPACT, volume: 0.9, pitch: 1.4, enabled: true, layer: {event: BLOCK_BEACON_POWER_SELECT, volume: 0.5, pitch: 1.8}}  # no thunder
    storm-bolt: {event: ENTITY_LIGHTNING_BOLT_IMPACT, volume: 0.5, pitch: 1.8, enabled: true}  # each particle bolt
    thunderstep: {event: ENTITY_LIGHTNING_BOLT_IMPACT, volume: 0.5, pitch: 2.0, enabled: true, layer: {event: ITEM_TRIDENT_RETURN, volume: 0.9, pitch: 1.8}}
    speed-boost: {event: BLOCK_COPPER_BULB_TURN_ON, volume: 0.8, pitch: 1.6, enabled: true}  # the tier 2 click
  puff: # Puff: wind, air
    double-jump: {event: ENTITY_WIND_CHARGE_WIND_BURST, volume: 1.0, pitch: 1.3, enabled: true}
    breezy-bash: {event: ENTITY_BREEZE_WIND_BURST, volume: 1.0, pitch: 0.8, enabled: true}
    dash: {event: ENTITY_BREEZE_SHOOT, volume: 0.9, pitch: 1.0, enabled: true, layer: {event: ENTITY_PHANTOM_FLAP, volume: 0.8, pitch: 1.6}}
  astra: # Astra: crystal, void (the only gem with amethyst HIT)
    daggers: {event: ITEM_TRIDENT_THROW, volume: 0.9, pitch: 1.6, enabled: true, layer: {event: BLOCK_AMETHYST_BLOCK_HIT, volume: 1.0, pitch: 1.5}}
    projection: {event: BLOCK_RESPAWN_ANCHOR_CHARGE, volume: 1.0, pitch: 1.4, enabled: true}
    dimensional-drift: {event: BLOCK_END_PORTAL_FRAME_FILL, volume: 1.0, pitch: 1.2, enabled: true, layer: {event: ENTITY_ENDERMAN_TELEPORT, volume: 0.7, pitch: 1.5}}
    astral-void: {event: BLOCK_AMETHYST_BLOCK_HIT, volume: 1.0, pitch: 0.6, enabled: true}  # the cast; disabled players hear general.gem-disabled
  flux: # Flux: lasers, power
    energy-beam: {event: ENTITY_GUARDIAN_ATTACK, volume: 0.9, pitch: 1.4, enabled: true}
    kinetic-burst: {event: ENTITY_WARDEN_SONIC_BOOM, volume: 0.5, pitch: 1.6, enabled: true}
    overdrive: {event: BLOCK_BEACON_ACTIVATE, volume: 0.9, pitch: 1.0, enabled: true, layer: {event: BLOCK_CONDUIT_ACTIVATE, volume: 0.8, pitch: 1.0}}
    ingot-to-watts: {event: BLOCK_CONDUIT_AMBIENT_SHORT, volume: 0.8, pitch: 1.6, enabled: true}  # you only
  wealth: # Wealth: coins, locks (no XP orb anywhere)
    pockets: {event: BLOCK_ENDER_CHEST_OPEN, volume: 1.0, pitch: 1.3, enabled: true}
    item-lock: {event: BLOCK_CHEST_LOCKED, volume: 1.0, pitch: 1.0, enabled: true, layer: {event: BLOCK_IRON_TRAPDOOR_CLOSE, volume: 0.8, pitch: 0.7}}
    rich-rush: {event: BLOCK_VAULT_INSERT_ITEM, volume: 1.0, pitch: 1.0, enabled: true, layer: {event: BLOCK_CHAIN_STEP, volume: 0.6, pitch: 2.0}}
    amplification: {event: BLOCK_ENCHANTMENT_TABLE_USE, volume: 1.0, pitch: 1.2, enabled: true}
  life: # Life: growth (no Warden, amethyst or anvil)
    heart-drainer: {event: BLOCK_AZALEA_LEAVES_BREAK, volume: 0.9, pitch: 1.0, enabled: true, layer: {event: ITEM_BONE_MEAL_USE, volume: 0.9, pitch: 1.2}}
    circle-of-life: {event: ITEM_BONE_MEAL_USE, volume: 0.9, pitch: 1.0, enabled: true, layer: {event: BLOCK_SWEET_BERRY_BUSH_PICK_BERRIES, volume: 0.7, pitch: 1.3}}
    vitality-vortex: {event: ENTITY_EVOKER_CAST_SPELL, volume: 0.9, pitch: 1.4, enabled: true, layer: {event: BLOCK_BUBBLE_COLUMN_WHIRLPOOL_INSIDE, volume: 0.7, pitch: 1.0}}
    siphon: {event: ITEM_BONE_MEAL_USE, volume: 0.9, pitch: 0.8, enabled: true}  # the tier 1 power
  heretic: # Heretic: gore, sculk (the only gem with the Warden heartbeat)
    bloodsaws: {event: BLOCK_GRINDSTONE_USE, volume: 1.0, pitch: 1.4, enabled: true, layer: {event: ENTITY_PLAYER_ATTACK_SWEEP, volume: 0.9, pitch: 0.6}}
    bloodsaw-hit: {event: ENTITY_PLAYER_ATTACK_SWEEP, volume: 0.8, pitch: 0.6, enabled: true}  # was a note-block pling at 2.0
    spore: {event: BLOCK_SPORE_BLOSSOM_BREAK, volume: 1.0, pitch: 1.0, enabled: true, layer: {event: BLOCK_SCULK_SPREAD, volume: 1.0, pitch: 1.0}}
    bloodlinking: {event: ENTITY_WARDEN_HEARTBEAT, volume: 1.2, pitch: 1.0, enabled: true}  # on link
    bloodlink-slam: {event: ITEM_MACE_SMASH_GROUND_HEAVY, volume: 1.0, pitch: 0.9, enabled: true}  # each slam
  auratus: # Auratus: metal, bells (chains, bells and shields only)
    chain-throw: {event: BLOCK_CHAIN_PLACE, volume: 0.8, pitch: 1.2, enabled: true}  # at you, any hook
    chain-hook-enemy: {event: BLOCK_CHAIN_PLACE, volume: 1.3, pitch: 0.7, enabled: true}  # at the enemy: the heavy clink
    fly-to-hook: {event: BLOCK_CHAIN_HIT, volume: 0.8, pitch: 1.4, enabled: true}
    reel-arrive: {event: ITEM_ARMOR_EQUIP_CHAIN, volume: 0.7, pitch: 1.3, enabled: true}
    tug: {event: BLOCK_CHAIN_BREAK, volume: 1.0, pitch: 0.9, enabled: true}  # arriving at an enemy, or a haul ending
    haul: {event: BLOCK_CHAIN_HIT, volume: 1.2, pitch: 0.6, enabled: true}
    hook-slides-out: {event: BLOCK_CHAIN_FALL, volume: 0.6, pitch: 1.0, enabled: true}
    snap: {event: BLOCK_CHAIN_BREAK, volume: 1.0, pitch: 1.3, enabled: true}
    not-ready: {event: BLOCK_CHAIN_FALL, volume: 0.5, pitch: 1.6, enabled: true}  # you only: a miss, no charge, slam on cooldown
    aegis: {event: ITEM_TRIDENT_RETURN, volume: 1.0, pitch: 1.5, enabled: true, layer: {event: BLOCK_AMETHYST_BLOCK_RESONATE, volume: 1.0, pitch: 1.3}}
    aegis-strike: {event: BLOCK_BELL_USE, volume: 0.9, pitch: 1.2, enabled: true}  # the shield hits someone
    aegis-catch: {event: BLOCK_BELL_USE, volume: 1.0, pitch: 0.7, enabled: true, layer: {event: BLOCK_CHAIN_PLACE, volume: 0.8, pitch: 0.6}}  # the shield catches a pulled enemy
    aegis-fizzle: {event: BLOCK_CHAIN_FALL, volume: 0.4, pitch: 0.8, enabled: true}  # you only
    parry: {event: ITEM_SHIELD_BLOCK, volume: 1.0, pitch: 1.3, enabled: true, layer: {event: BLOCK_BELL_USE, volume: 1.0, pitch: 1.6}}  # your pack sound instead: event: blissgems:auratus.parry
    slam-start: {event: BLOCK_CHAIN_PLACE, volume: 1.0, pitch: 0.5, enabled: true}
    gilded-slam: {event: ITEM_MACE_SMASH_GROUND_HEAVY, volume: 1.0, pitch: 0.8, enabled: true, layer: {event: ENTITY_FIREWORK_ROCKET_LARGE_BLAST, volume: 0.8, pitch: 1.0}}  # the gold firework makes the blast itself, so the layer only plays with the firework off
    flagpole: {event: BLOCK_CHAIN_PLACE, volume: 1.2, pitch: 0.6, enabled: true, layer: {event: BLOCK_BELL_USE, volume: 0.6, pitch: 0.8}}
    flagpole-release: {event: BLOCK_CHAIN_BREAK, volume: 0.8, pitch: 0.9, enabled: true}
    launch: {event: ENTITY_FIREWORK_ROCKET_LARGE_BLAST, volume: 1.0, pitch: 1.0, enabled: true, layer: {event: ENTITY_WARDEN_SONIC_BOOM, volume: 0.3, pitch: 2.0}}
    shield-jam: {event: ITEM_SHIELD_BREAK, volume: 0.8, pitch: 1.2, enabled: true}  # Hauling Strike drops a shield
  relay: # Relay: time (low pitch = slowed time)
    rewind: {event: "blissgems:relay.rewind", volume: 1.0, pitch: 1.0, enabled: true, fallback: {event: BLOCK_BEACON_DEACTIVATE, volume: 0.8, pitch: 1.4}}  # your reversed bell (rewind.ogg); fallback when custom sounds are off
    time-dilate: {event: "blissgems:relay.time_dilate", volume: 1.0, pitch: 1.0, enabled: true, fallback: {event: BLOCK_BEACON_AMBIENT, volume: 0.9, pitch: 0.5}}  # your slowed beacon + bell (time_dilate.ogg), when the bubble opens
    divinity: {event: BLOCK_END_PORTAL_SPAWN, volume: 0.4, pitch: 0.7, enabled: true, layer: {event: BLOCK_BELL_RESONATE, volume: 0.8, pitch: 0.6}}  # end portal spawn is loud: keep it low
    rift-menu: {event: BLOCK_BELL_RESONATE, volume: 0.4, pitch: 1.5, enabled: true}  # you only
    rift-set-anchor: {event: BLOCK_RESPAWN_ANCHOR_SET_SPAWN, volume: 0.8, pitch: 0.8, enabled: true}
    rift-channel: {event: BLOCK_PORTAL_TRIGGER, volume: 0.4, pitch: 1.6, enabled: true}  # quiet, for the 5s channel
    rift-close: {event: BLOCK_GLASS_BREAK, volume: 0.5, pitch: 0.55, enabled: true}  # the tear snapping shut
    rift-arrival: {event: ENTITY_ENDERMAN_TELEPORT, volume: 0.9, pitch: 0.8, enabled: true, layer: {event: BLOCK_RESPAWN_ANCHOR_DEPLETE, volume: 0.8, pitch: 1.0}}
    tuned-tag: {event: BLOCK_SCULK_SENSOR_CLICKING, volume: 1.0, pitch: 1.6, enabled: true}  # you only, when you tag a new player
    tuned-full: {event: BLOCK_AMETHYST_BLOCK_CHIME, volume: 1.0, pitch: 1.0, enabled: true, layer: {event: BLOCK_NOTE_BLOCK_BIT, volume: 0.6, pitch: 2.0}}  # you only, when the bar fills
  other: # Not gems
    pedestal-activate: {event: BLOCK_TRIAL_SPAWNER_OMINOUS_ACTIVATE, volume: 0.8, pitch: 1.0, enabled: true}  # the heart pedestal (was the Wither spawn)
  capture: # Capture points (/capture), not a gem
    step-on: {event: BLOCK_BEACON_POWER_SELECT, volume: 0.5, pitch: 1.4, enabled: true}  # you only, when you step onto a running point
    contested: {event: BLOCK_NOTE_BLOCK_BASS, volume: 0.35, pitch: 0.6, enabled: true}  # everyone on the point, at most every 2 s while it's contested
    win: {event: UI_TOAST_CHALLENGE_COMPLETE, volume: 1.0, pitch: 1.0, enabled: true}  # the winner only

mythics:
  enabled: true
  drop-on-death: true
  glow: true # mythic holders glow; standard gems never do

  heretic:
    passives:
      hemorrhage-multiplier: 2.0
      auto-crit-multiplier: 1.5
      shield-disable-ticks: 100 # shield jam on hits, wall flips 5s/10s
      blood-hardening-max-damage: 14.0 # 7 hearts
    bloodsaws:
      recharge-ms: 5000 # two independent charges, 5s each
      speed: 1.65
      idle-despawn-ms: 5000 # vanishes 5s after last hit: ding + firework burst
      drag-ticks: 20 # cut victims are dragged along in the wake this long
      damage: 7.0 # per saw hit, pierces armour (x2 on a bleeding target: Hemorrhage)
      hit-radius: 0.8
      spawn-spacing: 0.55
      max-bounces: -1 # -1 = true reflection, unlimited
      spore-window-ms: 650
    spore:
      radius: 4.0
      duration-ms: 8000
      bleed-ms: 8000
    bloodlinking:
      cooldown-seconds: 100
      launch-y: 1.35
      dive-speed: 1.3
      radius: 4
      damage: 9.0 # per slam, pierces armour (x2 on a bleeding target)
      max-slams: 3
      max-victims: 2

  # Auratus (rebuilt; see AURATUS.md). Main hand: left-click throws a chain, right-click Aegis (or, while a hook is in,
  # goes there), sneak + left-click in the air Gilded Slam. Off hand: right-click throws / goes, sneak + right-click Aegis
  # (or the slam, in the air). Swap hands (F) hauls a hooked creature in. Pull an enemy in, catch them with the Aegis:
  # nothing else = Flagpole, chain again = the launch. Damage numbers are before ability-damage.multiplier and its cap,
  # except flagpole.finisher-damage.
  # Servers upgrading from the old Auratus get this section fresh once; Feathered Fall and the chain model settings are kept.
  auratus:
    passives:
      feathered-fall-damage-multiplier: 0.10 # Feathered Fall (unchanged): 90% less fall damage
      hauling-strike-extra-reach: 1.0 # Hauling Strike: melee reach added while holding the gem (vanilla is 3)
      hauling-strike-pull: 0.3 # full-strength hits pull the target toward you this hard instead of knocking them away; 0 = vanilla knockback
      hauling-strike-shield-ticks: 100 # full-strength hits drop a raised shield and jam it this long
      angels-grasp-seconds: 4 # slam and Flagpole victims can't ender pearl, wind charge, eat chorus fruit or use a trident
      angels-grasp-chain-seconds: 2 # the same from a chain hook (shorter, so two charges can't lock someone down); 0 = none
      divine-purity-multiplier: 0.5 # harmful effects on you last this fraction as long; a parry also cleanses them
    chain: # Venerated Perforators. A chain hooks whatever it hits (an enemy, a creature, a block, the Echo Anchor) and
      # stays: right-click to go there, swap hands (F) to haul a creature to you, or leave it. It snaps on a wall.
      charges: 2
      recharge-seconds: 8 # each charge on its own timer
      range: 40.0
      min-entity-distance: 3.5 # an enemy closer than this (or within your melee reach, if longer) is just a swing: no chain, no charge
      reel-speed: 1.1 # top reel-in speed, blocks/tick (~22 blocks/s)
      ramp-ticks: 4 # ticks to reach that speed
      max-reel-ticks: 40
      arrival-momentum: 0.45 # share of the reel speed you keep when you arrive
      hit-damage: 3.0 # when the hook bites an enemy (x3 = 9 HP, 4.5 hearts unarmored); once per hook
      hook-seconds: 6 # how long the hook stays if you do nothing
      haul-speed: 1.0 # top speed hauling them to you (F), blocks/tick
      haul-max-ticks: 30
      show-models: true # chain links + hook from the pack (echo shard models 12348/12349); false = gold dust
      link-scale: 1.0 # size of the links; the chain always runs from your hand to the hook's point
    aegis: # Echoing Aegis
      cooldown-seconds: 15
      success-cooldown-seconds: 10 # counted from the cast, when the parry caught a hit
      window-ms: 1000
      reflect: 0.5 # share of a parried hit sent back to the attacker
      attacker-slow-seconds: 1.5 # Slowness II on whoever you parried
      weapon-durability-loss: 30 # off the attacker's weapon on a parried melee hit
      heal-hp: 5.0 # once per Aegis, on the first parry
      speed-seconds: 3 # Speed II, same
      anchor-height: 8.0 # the Echo Anchor appears up to this high above you
      anchor-seconds: 5
      anchor-cone-degrees: 35 # throw a chain within this angle of the anchor and it latches on
      distance: 3.0 # the shield appears this far ahead where you look (closer if a wall is nearer)
      strike-radius: 1.3 # anyone this close to the shield takes a hit
      strike-damage: 5.0 # x3 = 15 HP (7.5 hearts unarmored, ~1 heart through full Prot IV diamond)
      strike-ticks: 6 # the shield keeps catching arrivals this many ticks
    slam: # Gilded Slam: sneak + chain while 4+ blocks up (costs no chain charge)
      cooldown-seconds: 0 # like the old slam, none: getting back up costs chains
      min-height: 4.0 # blocks above the ground needed; lower down, sneak + chain is just a chain
      range: 24 # how far away the landing spot can be (where you look, or straight down)
      dive-speed: 1.6
      radius: 5.0
      damage-center: 6.0 # x3 = 18 HP (9 hearts) unarmored at the centre
      damage-edge: 3.0 # at the edge of the radius
      launch: 0.45 # upward pop on everyone hit
    flagpole: # Pull an enemy in (or hook them), then catch them with the Aegis: nothing else = Flagpole, chain again = the launch
      cooldown-seconds: 25 # shared by Flagpole and the launch
      hook-memory-seconds: 5 # the Aegis catches an enemy you hooked or pulled in this recently
      window-ms: 750 # after the catch: chain within this for the launch, otherwise Flagpole
      finisher-damage: 72 # the launch's hit, raw (no ability multiplier or cap): ~22 HP through full Prot IV diamond, a kill from full health
      finisher-launch-height: 30 # blocks they're thrown straight up (the fall comes on top)
      height: 5.0 # lifted this high (less under a ceiling)
      hold-seconds: 2.5
      ceiling-cap: false # false: under a low ceiling they fly up into it and stay pinned there. true: they stop below it (no lift in a 2-high tunnel)
    visuals: # firework bursts and sparks; no firework from this plugin can hurt anyone
      slam-burst: true # Gilded Slam: a white sphere (fading pale blue) at a random spot 1.5-3 blocks from the landing, 0.5-2.5 up
      slam-sparks: true # Gilded Slam: firework sparks from random spots on the ground, shooting up and drifting down
      slam-spark-count: 30
      launch-burst: true # the launch: a gold sphere where they stood (its blast replaces launch's own blast sound)
      flagpole-burst: true # Flagpole: a gold sphere on them as they're hoisted

  # Relay Gem: prize for "The Signal" ARG. One of a kind, ignores energy, drops on death.
  relay:
    passives:
      tag-duration-ms: 30000 # retained damage-tag passive, independent from the charge meter
      tag-damage-bonus: 0.05 # +5% damage from the holder against tagged players
      tag-ring: true # a turning ring of dust at the feet of players you've tagged, while you hold the Relay
      tag-ring-color: "#B0703A" # Relay brown; "#FFFFFF" for white
      tag-ring-everyone: false # false: only the tagger sees the ring. true: everyone nearby does
      attack-speed-multiplier: 1.2 # Quickened: holding the gem swings 1.2x faster

    rewind:
      charges: 2 # independent charges, like Auratus' chains
      regen-ms: 20000 # per charge
      window-ms: 5000 # how far back Rewind snaps (position + health, clears debuffs)
    # Temporal v2 keys avoid accidentally inheriting the old Time Lock/Tuned In settings.
    # These balance defaults are proposals: tune after multiplayer testing.
    temporal:
      charge:
        maximum: 100
        # Every Relay power (Rewind, Time Dilate, Temporal Divinity, Rift) needs a full Tuned In bar and empties it
        # when it succeeds. false: each power uses its own cost below (and divinity.required-charge).
        full-to-use: true
        hits-to-fill: 10 # hits on players that fill the bar from empty; 0 = use "hit" below
        rewind-share: 0.5 # Rewind still needs a full bar but only uses this share of it (0.5 = half)
        hit: 8 # charge per hit dealt, only when hits-to-fill is 0
        received: 4
        minimum-damage: 0.5 # final damage in HP, after cancellation/protection
        minimum-spacing-ms: 400 # shared per recipient for dealt/received gains
        afk-timeout-seconds: 30 # requires recent look/input; knockback alone does not qualify
        allow-mobs: false
        decay-grace-seconds: 15
        decay-per-second: 0 # disabled; set >0 to enable
        persist-death: false
        persist-logout: true
        persist-restart: true # PDC saved by normal player saves; hard crash may lose recent gains
        dilate-cost: 0 # used only when full-to-use is false
        rewind-cost: 0 # used only when full-to-use is false
        rift-cost: 0 # used only when full-to-use is false
      dilate:
        cooldown-seconds: 65
        duration-seconds: 8 # server ticks; hard safety maximum 120 seconds
        radius: 10.0 # hard limit 48 blocks
        scale: 0.10 # approximate movement/attack/gravity; not a per-entity simulation tick rate
        max-fields: 8
        max-entities-per-field: 256
        horizontal-speed-cap: 0.6 # blocks/tick at 1x; caps retained knockback/momentum at the field scale
        melee-base-interval-ticks: 10 # scaled by 1/time-scale; applies to accepted melee damage
        display-models: true # use supplied overlay; false enables bounded particle fallback
        glow: true # brown Glowing outline on the clock (shows through walls, like the vanilla Glowing effect)
        clock-depth: 3 # the clock (and the field's centre) goes this many blocks below you, or on the floor if that is closer
        swim: true # while you're in the air inside your own field you air-swim, as in Temporal Divinity (uses the divinity swim-* settings)
        landing-grace-ticks: 200 # if the swim ends mid-air you take no fall damage until you land (or this many ticks pass)
        glow-color: "#B0703A"
        particle-interval-ticks: 4
      divinity:
        required-charge: 100
        cooldown-seconds: 90
        duration-seconds: 8 # server ticks; hard safety maximum 20 seconds
        capture-radius: 10.0
        max-opponents: 8
        allow-solo: false # TESTING ONLY: true lets the caster open the domain with no opponent nearby
        max-sessions: 4 # hard limit 8; spatially isolated cells 1024 blocks apart
        world: soulbound_temporal_void # must be new, or marked as owned by this plugin
        fallback-world: '' # empty = first non-domain world; used if original world/position is unavailable
        altitude: 160 # clamped to legal world height
        boundary-radius: 48.0 # ends the session if a participant leaves this sphere
        enemy-scale: 0.15
        # Captured opponents: suspended, no controller. They sink at this rate and cannot rise or steer.
        downward-drift: 0.06 # blocks/tick, clamped 0.005..0.5; at least 0.035 while server.properties allow-flight=false (vanilla hover kick)
        enemy-horizontal-damping: 0.5 # 0..1 share of an opponent's sideways momentum (knockback) removed every tick
        # Caster only: air-swimming (replaces native flight). W/S follow where you look, A/D strafe,
        # jump rises, sneak dives (after sneak is released once from casting), sprint surges forward.
        swim-speed: 0.38 # blocks/tick top speed (7.6 blocks/s), clamped 0.05..1.0
        swim-sprint-multiplier: 1.5 # forward sprint, clamped 1..2
        swim-acceleration: 0.14 # 0.02..1 share of the gap to the wanted velocity closed per tick; lower = heavier, 1 = instant
        swim-drag: 0.86 # 0..0.98 speed kept per tick with no input; lower stops sooner
        swim-stroke: 0.10 # 0..0.4 rhythmic surge while swimming; 0 = perfectly even speed
        attack-speed-multiplier: 5.0
        minimum-hit-interval-ticks: 4
        hurt-window-ticks: 2 # restored to each target's original value on exit
        damage-multiplier: 0.50
        maximum-hit-damage: 6.0 # HP before armor, applied to caster's domain damage
        return-fall-grace-ticks: 100
      hud:
        use-glyphs: true # false uses text labels; no client pack detection is attempted
    # Rift [Sneak + left-click gem]: quick travel between two saved anchors, A and B.
    # The menu travels to an anchor or saves where you stand. Travelling channels first; when it completes
    # the rift stays open behind you and anyone who walks in follows you to the same anchor.
    rift:
      enabled: true # false switches Rift off without a rebuild (the HUD slot disappears)
      cooldown-seconds: 300 # after a completed jump; separate from every other Relay cooldown
      channel-seconds: 5
      cancel-distance: 1.5 # blocks you may drift from where the channel started
      # A channel broken by damage, moving, death, logout or letting go of the Relay costs this much.
      # A rift that fails for safety reasons (no safe ground, teleport blocked) costs nothing.
      cancel-cooldown-seconds: 10
      combat-tag-seconds: 15 # no Rift within this long of hitting, or being hit by, another player
      open-seconds: 4 # how long the rift stays open behind you for others to follow
      follow-delay-ticks: 20 # a follower arrives this long after stepping in
      arrival-protection-ticks: 20 # fall-damage protection on arrival; nothing else is granted
      safe-search-radius: 5 # landing spot is the nearest safe block within this many blocks of the anchor
      flash-radius: 64 # players this close see the arrival particles
      blocked-worlds: [] # worlds where anchors can't be set or reached, e.g. [world_nether]
      # Boxes where anchors can't be set or reached, e.g. the abyss or arena areas:
      #   - {name: the abyss, world: world, x1: -200, z1: -200, x2: 200, z2: 200}
      blocked-areas: [] # TODO before the season: add the abyss and each Pantheon arena (format above)
      width: 2.5 # blocks
      height: 6.0 # blocks
      glow-color: "#B0703A"
      display-models: true # false draws the rift in dust instead of pack textures
      particles: true # dust drifting into the rift
    hud:
      # Pack font glyphs. Without the overlay pack use plain text instead (for example "<<", "(*)", "(o)").
      rewind-glyph: "\uE040"
      tuned-glyph: "\uE042" # compass, empty bar (fallback)
      # Tuned In charging, 6 frames: compass with the bar empty .. full
      tuned-charge-glyphs: ["\uE042", "\uE058", "\uE059", "\uE05A", "\uE05B", "\uE05C"]
      dilation-glyph: "\uE041"
      rift-glyph: "\uE043" # text fallback "Rift" when temporal.hud.use-glyphs is false
      divinity-glyph: "\uE044" # text fallback "Divinity" when temporal.hud.use-glyphs is false
      rift-position: hotbar # hotbar: Rift icon + timer just right of the hotbar. inline: in the action bar with the others
      tuned-position: hotbar # hotbar: Tuned In meter just after the Rift slot, right of the hotbar. inline: in the action bar
      rift-hotbar-offset: 0 # nudge the Rift / Tuned In slots left (negative) or right (positive), in GUI pixels
      # Legacy compass frames retained for pack compatibility; temporal HUD uses charge frames.
      tuned-glyphs: ["\uE050", "\uE051", "\uE052", "\uE053", "\uE054", "\uE055", "\uE056", "\uE057"]

  # The Revenant: the final boss weapon (a mace, not a gem). Only from /revenant give; see REVENANT.md.
  revenant:
    enabled: true
    plunge: # [Right-click] leap up, then slam down where you look
      charges: 2
      recharge-seconds: 12 # each charge on its own timer
      leap-height: 12 # blocks
      leap-forward-speed: 0.35 # blocks/tick of forward drift during the leap
      range: 16 # how far away the slam can land
      slam-speed: 1.8 # blocks/tick on the way down
      radius: 4 # impact radius
      base-damage: 6 # a mace hit; the vanilla mace fall bonus is added on top, falling to half at the edge
      damage-cap: 28 # most HP one Revenant hit can deal, melee included (28 = 14 hearts), before armor
      knockback: 1.0 # outward push on impact (never upward)
    rising: # [Sneak + right-click] sink, then rise behind the nearest enemy
      cooldown-seconds: 25 # half comes back if there is no safe spot behind them
      range: 20
      sink-ticks: 20
    undertow: # [Sneak + left-click] pull every enemy in; no damage
      cooldown-seconds: 30
      radius: 8
      strength: 1.4 # strongest pull, blocks/tick
    abyssal-weight-seconds: 2 # his hits stop the target jumping or being launched upward (no icon or particles)
    boss:
      max-health: 60 # total HP while he holds the mace (60 = 30 hearts, 3x a normal player)
      knockback-resistance: 0.6
      bar-radius: 100 # players this close see his boss bar
      phase2-plunge-recharge: 0.7 # phase 2 (half health): Plunge recharges in 70% of the time
    phase2-sky: true # phase 2 borrows the finale's red sky and overlay
    phase2-sky-seconds: 10
    # Temporal Divinity never takes him to the void: it suspends him 3 blocks up instead, unable to move or use
    # powers, with no knockback resistance. Everyone else it catches goes to the void as usual.
    divinity-suspend-seconds: 5
    divinity-suspend-seconds-phase2: 3
    divinity-immunity-seconds: 30 # after a suspension ends he can't be suspended again for this long
    return-delay-seconds: 5 # a holder who rejoins a paused fight gets the mace back after this warning
    hud:
      use-glyphs: true # false: text labels instead of the pack's icons
      plunge-glyph: "\uE046"
      rising-glyph: "\uE047"
      undertow-glyph: "\uE048"

# Flat damage of standard-gem abilities: Crisp, Breezy Bash, Dash, Kinetic Burst and Energy Beam.
# Their base numbers (4, 6, 3 a second, up to 10, up to 14.5 HP) suit unarmored targets but do under 1 heart
# through Protection IV diamond, so they are multiplied here. Fireball has its own setting below.
ability-damage:
  multiplier: 3.0 # 1.0 = the old damage
  cap: 40.0 # most one ability hit can deal before Protection, bonuses included; 0 = no cap
  # true: ability hits skip armour points, like magic; Protection and Resistance still reduce them. A hit then lands about
  # the same on everyone: Crisp is 2.2 hearts through Prot IV diamond and 6 unarmoured (0.7 and 6 with armour counting).
  # Also the Heretic's saws and slams, Astra daggers and Blur clones. Not the Auratus or the Revenant (tuned with armour).
  pierce-armor: true

# Fire gem Fireball (T2 power): left-click to start charging, left-click again to launch.
fire:
  fireball:
    charge-bossbar: true # show the charge as a bossbar while charging
    explode: true # false = old behaviour (direct hit and fire only, no explosion)
    explosion-power-min: 1.0 # at the weakest charge that still fires; a ghast fireball is 1.0
    explosion-power-max: 3.0 # at full charge; TNT is 4.0, hard limit 8.0
    damage-multiplier: 1.0 # blast damage to everyone but the caster; 1.0 = a vanilla explosion of that power on Normal, 0 = none
    break-blocks: true # false = damage and knockback only, terrain untouched
    set-fire: true # the blast leaves fire behind

# Abilities that hold several charges, each recharging on its own.
abilities:
  storm: # Speed gem, Speedy Storm
    charges: 3
    # Each charge takes cooldowns.storm seconds to come back (also editable in /config).
    # Add "charge-recharge-seconds: <n>" here to override that.
  dash: # Puff gem, Dash: anyone you dash past is hurt once a second
    damage-per-second: 3.0 # before ability-damage.multiplier
    damage-seconds: 3
  blur: # Speed gem, Blur
    clone-damage: 1.0 # each clone's hit, x ability-damage.multiplier, pierces armour; at most one hit a second per clone
    # Blur stays active for as long as you keep hitting the same target with the gem in your main hand.
    # It ends if you go this long without hitting them, or as soon as they hit you back.
    combo-window-seconds: 3.0

# Astra Daggers (T2): 5 hover round you; each left-click fires one (the pack's dagger model, flying tip first).
# The cooldown (cooldowns.daggers, 90 s) starts after the fifth; then all 5 come back.
astra:
  dagger-speed: 3.0 # blocks per tick
  dagger-hit-damage: 2.5 # each dagger that hits, x ability-damage.multiplier (7.5), pierces armour; also disables their gem 8 s

# Crafting recipes. min-progression gates by era (1-4).
# Edit shapes/ingredients freely, then /progression <1-4> to reload.
recipes:
  upgrader:
    min-progression: 3
    type: shaped
    shape: [DGD, GSG, DGD]
    ingredients: {D: DIAMOND_BLOCK, G: AMETHYST_SHARD, S: NETHER_STAR}
    result-kind: upgrader
  trader:
    min-progression: 3
    type: shaped
    shape: ["D D", " S ", "D D"]
    ingredients: {D: DIAMOND_BLOCK, S: SCULK_CATALYST}
    result-kind: trader
  repairkit:
    min-progression: 3
    type: shaped
    shape: [IAI, ANA, IAI]
    ingredients: {I: IRON_BLOCK, A: AMETHYST_SHARD, N: NETHERITE_INGOT}
    result-kind: repairkit

# Server progression (1-4 via /progression).
# P1-3: border 6000, P4: border 30000.
# P1: no enchants, no potions, no obsidian pickup.
# P2-3: Prot III, Sharp III, chorus cap 16.
# P4: Prot IV, Sharp V, chorus unlimited, Dragon Egg +40 hearts.
progression:
  level: 1

# Gem lore lettering. Item-history lines (STOLEN by ...) always stay as they are.
#   capitals: only letters that were capitals become small caps ("RELAY GEM" -> "ʀᴇʟᴀʏ ɢᴇᴍ", "Tuned In" -> "ᴛuned ɪn")
#   all:      every letter in small caps ("ᴛᴜɴᴇᴅ ɪɴ")
#   off:      normal lettering
# Existing gems are rewritten in the new style when held or when their owner joins.
lore:
  small-caps: capitals

# Standard-gem ability cooldowns in seconds (Energy-stage multiplier still applies).
# Tune live via /config instead of editing this file.
cooldowns:
  crisp: 15
  thunderstep: 15
  blur: 15
  pockets: 10
  burst: 10
  doublejump: 5
  vortex: 60
  bash: 60
  dash: 40
  daggers: 90
  chad: 120
  nullify: 120
  itemlock: 120
  storm: 120
  heartdrainer: 120
  circle: 120
  beam: 120
  void: 120
  fireball: 180
  overdrive: 180
  cozy: 180
  amp: 240
  richrush: 300
  bounty: 35

# The Signal / Relay finale — adjustable defaults.
turmoil:
  redsky:
    enabled: true
    time: 12800
    rain: false
    overlay: false
  passive:
    range: 24.0
    speed: 1.25
    damage: 4.0
    cooldown-ticks: 20
  night:
    armor: true
    damage-multiplier: 2.0
  broadcast:
    message: "Spawn."

finale:
  gather-radius: 80.0
  pedestal:
    distance: 6.0 # with no spot set: this far either side of the finale center (/turmoil pedestal 1|2 sets exact spots)
    reach: 4.0
    timeout-seconds: 0 # 0 = voluntary drops only; never auto-take gems
    custom-model: true # the pack's pedestal models (gold trim for Auratus, red for Heretic); false = the old stacked blocks
  seal: # a golden clock seal on the ground under the merge, spinning faster as the gems close in (pack model)
    enabled: true
    size: 7.0 # blocks across
  dome:
    enabled: true
    radius: 8.0
  web:
    radius: 3.2
  sky:
    time: 12600
    rain: true
    during-battle: false
  overlay:
    enabled: true
    style: gold # "gold" now holds the brown haze frames
    frame-ticks: 4
    fade-in-ticks: 30 # 1.5 s fade in when the cutscene starts (0 = pop in)
    fade-out-ticks: 30 # 1.5 s fade out when it ends (0 = cut)
  sparkles: true
  flash:
    enabled: true # requires matching resource-pack glyph
    glyph: "\uE120"
    color: "#5A3A1C"
    hold-ticks: 20 # 1 s of full brown
    fade-ticks: 60 # then 3 s fading out
  kit:
    enabled: true
    # true: the chosen player fights in their own armor, weapons and tools, temporarily raised to
    #   Protection IV, Sharpness V, Efficiency V, Power V, Unbreaking III and Mending where each fits.
    #   Their originals are saved and handed back when the finale ends.
    # false: the old loaner set (unbreakable netherite) with the two levels below; their inventory is emptied for the fight.
    own-gear: true
    food: true # also hand out 64 golden apples and 64 golden carrots
    protection: 3 # loaner set only
    sharpness: 3 # loaner set only

# Capture points (/capture, see CAPTURE.md): hold a box to win a mythic. Week 1 awards Heretic, week 2 Auratus.
# One player on the point gains time. Players who aren't trusted with each other contest it and nobody gains;
# trusted players count as one side and all gain. Leaving or dying keeps your time. First to the hold time wins.
capture:
  hold-seconds: 120 # default for /capture start: one player's total time on the point to win
  max-size: {x: 64, y: 32, z: 64} # the biggest box /capture create accepts, in blocks
  bossbar-radius: 64 # players this close to the point see its boss bar
  glow-when-idle: false # true: the floor glows whenever the point exists, not only while a capture runs
  particles: false # also coloured dust along the edges, for players who can't see displays well
  floor: # the glowing ground: flat text displays tiled over the box's floor
    alpha-min: 0.35 # 0-1, the dim end of the slow pulse
    alpha-max: 0.55 # the bright end
    pulse-seconds: 3.0 # one breath from dim to bright and back
    max-displays: 32 # floor tiles per point; bigger boxes get bigger tiles
  bands: # thin bands of light rising from the edges while a capture runs
    interval-seconds: 0.4 # a new band at a random spot on the edges this often
    height: 4.0 # how far each band rises
    lifetime-seconds: 2.0 # it rises and fades out over this long
    max: 24 # bands alive at once per point
    width: 0.15 # blocks
    length: 1.5 # blocks
    alpha: 0.7 # 0-1 when it appears
