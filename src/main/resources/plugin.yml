name: SoulboundGems
version: 1.3.0-temporal
main: dev.soulbound.SoulboundGemsPlugin
api-version: '1.21.11'
author: Amon
description: Original Bliss-inspired gem system with Mythics Auratus and Heretic. Not affiliated with Bliss SMP.
commands:
  bliss:
    description: Bliss-like gem commands
    usage: /bliss <info|withdraw|track <player>|trust <add|remove|list> [player]|give <player> <gem> [tier] [energy]|setenergy <player> <0-10>|giveitem <player> <item>|menu|config|pedestal <activate|deactivate>|build ...>
    permission: bliss.player
    permission-message: You lack permission.
  progression:
    description: Set the server progression (1-4).
    usage: /progression <1|2|3|4>
    permission: bliss.admin
    permission-message: You lack permission.
  mythicconfig:
    description: In-depth live tuner for Auratus and Heretic numbers.
    usage: /mythicconfig
    permission: bliss.admin
    permission-message: You lack permission.
  givegem:
    description: Give a gem by tier choice, e.g. AstraT1.
    usage: /givegem <player> <AstraT1|AstraT2|FireT1|FireT2|...>
    permission: bliss.admin
    permission-message: You lack permission.
  blissop:
    description: Admin console — give the Prismatic Edge, set Pristine stages, reload, border growth.
    usage: /blissop <give <gem> [1|2]|mythic <auratus|heretic|relay> [player]|progression <1-4>|border <blocks> <seconds>|stalker <player|stop>|pris [player]|mace [player]|reloadconfig>
    permission: bliss.admin
    permission-message: You lack permission.
  turmoil:
    description: Manage The Signal world turmoil and Relay finale.
    usage: /turmoil <start|stop|status|spawn|setspawn|pedestal <1|2|clear>|overlay|finale>
    permission: soulbound.turmoil
  revenant:
    description: The Revenant, the final boss weapon.
    usage: /revenant <give <player> [fresh]|boss <start|stop>|status>
    permission: soulbound.revenant
    permission-message: You lack permission.
  capture:
    description: Capture points - hold a box to win a mythic.
    usage: /capture <create|color|start|stop|list|info|remove|tp> ...
    permission: soulbound.capture
    permission-message: You lack permission.
  stalker:
    description: Shadow Stalker — begin the hunt toward a tracked player.
    usage: /stalker <player>
    permission: bliss.player
    permission-message: You lack permission.
  gems:
    description: Rename gems, abilities and tiers, recolour gems, and see a player's gems.
    usage: /gems <rename <gem>[.<ability>] <name...>|color <gem> <colour>|names <reset [gem]|refresh>|info <player>>
    permission: soulbound.admin.names
    permission-message: You lack permission.
  gem:
    description: Nickname your own gem.
    usage: /gem nickname <name...> | /gem nickname clear
  goldgem:
    description: The Gold Gem - admins give, remove and set the ritual site; its holder marks, unmarks and switches.
    usage: /goldgem <give <player>|remove <player>|ritual set|mark <player>|unmark <player>|marks|switch|socket <gem>|unsocket <gem>|awaken|unawaken|testrepurpose [gem]|testsnap>
  rules:
    description: The combat rules - status, reload, turn a rule on or off, and the maces.
    usage: /rules <status|reload|toggle <rule>|mace <give <player>|list>>
    permission: soulbound.rules.admin
    permission-message: You lack permission.
permissions:
  soulbound.gold.admin:
    default: op
  soulbound.admin:
    default: op
  soulbound.rules.admin:
    default: op
  soulbound.rules.see-invisible:
    default: op
  soulbound.admin.names:
    default: op
  soulbound.nickname.color:
    default: op
  soulbound.turmoil:
    default: op
  soulbound.revenant:
    default: op
  soulbound.capture:
    default: op
  bliss.player:
    default: true
  bliss.admin:
    default: op
